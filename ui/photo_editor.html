<section class="sb-photo-editor" aria-label="จัดตำแหน่งและครอปรูปโปรไฟล์">
  <div class="crop-layout">
    <div>
      <div class="crop-stage">
        <canvas class="crop-canvas" width="512" height="512" tabindex="0" role="img" aria-label="รูปสำหรับครอป ลากเพื่อจัดตำแหน่ง หรือใช้ปุ่มลูกศรเมื่อโฟกัสรูป"></canvas>
      </div>
      <p class="crop-hint">ลากรูปเพื่อจัดตำแหน่ง · ใช้ปุ่มลูกศรเลื่อนรูปได้</p>
    </div>
    <aside class="crop-preview-panel">
      <span class="crop-kicker">รูปที่จะแสดง</span>
      <canvas class="crop-preview" width="128" height="128" role="img" aria-label="ตัวอย่างรูปโปรไฟล์วงกลม"></canvas>
      <strong>ตัวอย่างโปรไฟล์</strong>
      <p>วางใบหน้าหรือส่วนที่ต้องการไว้ตรงกลางวงกลม</p>
    </aside>
  </div>
  <div class="crop-zoom-header"><label for="avatar-zoom">ซูมรูป</label><output class="crop-zoom-value" for="avatar-zoom">100%</output></div>
  <input id="avatar-zoom" class="crop-zoom" type="range" min="1" max="4" step="0.01" value="1" aria-label="ซูมรูปโปรไฟล์">
  <div class="crop-actions"><button class="crop-reset" type="button">จัดกึ่งกลางใหม่</button><button class="crop-save" type="button" disabled>บันทึกรูปโปรไฟล์</button></div>
  <p class="crop-error" role="alert" hidden></p>
</section>
